<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelCraft | Creative Digital Services Studio</title>
    <meta name="description" content="PixelCraft is a premier creative digital services studio specializing in high-converting video editing, viral short-form content, YouTube thumbnails, and social media design." />
    <meta property="og:title" content="PixelCraft | Creative Digital Services Studio" />
    <meta property="og:description" content="Level up your digital presence with world-class video editing, YouTube packaging, and brand aesthetics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Ensure trailing slash on GitHub Pages so relative paths like ./assets/... resolve correctly
      (function() {
        if (window.location.hostname.indexOf('github.io') !== -1) {
          var p = window.location.pathname;
          if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body style="background-color: #07080d; color: #f1f5f9; margin: 0; min-height: 100vh;" class="bg-[#07080d] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-cyan-500 selection:text-black min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; background-color: #07080d; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #94a3b8; text-align: center; padding: 20px;">
        <div style="max-width: 320px;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #2563eb); margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div style="font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px; letter-spacing: 0.05em;">PIXELCRAFT STUDIO</div>
          <div style="font-size: 13px; color: #06b6d4; font-weight: 500;">Loading Creative Workspace...</div>
        </div>
      </div>
    </div>
    <script>
      // Fallback: If uncompiled main.tsx fails on static hosts like GitHub Pages, load pre-bundled assets
      window.addEventListener('error', function(e) {
        if (e.target && e.target.src && e.target.src.indexOf('main.tsx') !== -1) {
          if (!document.getElementById('pixelcraft-bundle-js')) {
            var s = document.createElement('script');
            s.id = 'pixelcraft-bundle-js';
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = './assets/index.js';
            document.body.appendChild(s);

            var l = document.createElement('link');
            l.id = 'pixelcraft-bundle-css';
            l.rel = 'stylesheet';
            l.crossOrigin = 'anonymous';
            l.href = './assets/index.css';
            document.head.appendChild(l);
          }
        }
      }, true);
    </script>
  </body>
</html>
